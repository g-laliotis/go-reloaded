name: Enhancement Request
description: Suggest an improvement or new feature for go-reloaded
title: "[Enhancement] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an enhancement! Please provide details about your idea.

  - type: textarea
    id: description
    attributes:
      label: Enhancement Description
      description: What enhancement would you like to see?
      placeholder: Describe the enhancement you'd like to see implemented
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: What problem does this solve or what value does it add?
      placeholder: Explain why this enhancement would be valuable
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Suggested Implementation
      description: Do you have ideas on how this could be implemented?
      placeholder: Any thoughts on implementation approach (optional)
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true